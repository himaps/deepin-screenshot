name: release

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-deb:
    name: Build ${{ matrix.osarch }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            multiarch: aarch64-linux-gnu
            osarch: linux-aarch64
          - arch: amd64
            runner: ubuntu-24.04
            multiarch: x86_64-linux-gnu
            osarch: linux-amd64
    # Native runners produce native builds, no cross compilation needed
    runs-on: ${{ matrix.runner }}
    # Build inside Ubuntu 20.04 (focal): the SAME distro base as the Kylin V10 SP1
    # target. Qt 5.12.8 and glibc 2.31 therefore match the target machine, so
    # the offline bundle never needs to upgrade an installed library - the
    # installer only ever adds packages that are missing. Earlier attempts
    # (bookworm glibc 2.36 / bullseye glibc 2.31 + Qt 5.15) required upgrading
    # systemd and other core libraries on the target, which crashed the OS.
    container: ubuntu:20.04
    env:
      # The debian/ubuntu-slim container's pkg-config does not search the
      # multiarch pkgconfig directory on its own
      PKG_CONFIG_PATH: /usr/lib/${{ matrix.multiarch }}/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig

    steps:
      - name: Install build dependencies
        run: |
          set -o pipefail
          {
            set -e
            export DEBIAN_FRONTEND=noninteractive
            # fail fast on stalled connections instead of hanging for hours,
            # and use the Azure Ubuntu mirror (runners are Azure-hosted)
            echo 'Acquire::http:Timeout "30";' > /etc/apt/apt.conf.d/99ci-settings
            echo 'Acquire::https:Timeout "30";' >> /etc/apt/apt.conf.d/99ci-settings
            echo 'Acquire::Check-Valid-Until "false";' >> /etc/apt/apt.conf.d/99ci-settings
            sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g; s|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list
            for attempt in 1 2 3 4; do
              if timeout 600 apt-get update; then
                break
              fi
              echo "apt-get update failed (attempt $attempt), retrying in 20s" >&2
              if [ "$attempt" = "4" ]; then
                exit 1
              fi
              sleep 20
            done
            # libxcb-util-dev was renamed from libxcb-util0-dev; capture first,
            # then match - `apt-cache | grep -q` under pipefail lets SIGPIPE
            # kill apt-cache and flip the probe result (known trap)
            XCBUTIL=libxcb-util0-dev
            PROBE="$(apt-cache show libxcb-util-dev 2>/dev/null || true)"
            case "$PROBE" in
              *'Package: libxcb-util-dev'*) XCBUTIL=libxcb-util-dev ;;
            esac
            for attempt in 1 2 3; do
              if timeout 1200 apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
                build-essential cmake pkg-config git curl ca-certificates xz-utils \
                qtbase5-dev qtbase5-private-dev qttools5-dev-tools \
                libqt5x11extras5-dev libqt5svg5-dev qtmultimedia5-dev \
                libgsettings-qt-dev librsvg2-dev libcups2-dev libegl1-mesa-dev \
                libfontconfig1-dev libfreetype6-dev libglib2.0-dev libmtdev-dev \
                libpulse-dev libstartup-notification0-dev libudev-dev \
                "$XCBUTIL" libx11-dev libxext-dev libxi-dev libxrender-dev x11proto-dev; then
                break
              fi
              echo "apt-get install failed (attempt $attempt), retrying in 30s" >&2
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep 30
            done
          } 2>&1 | tee build.log

      - name: Build DTK 5.2 and dtkwm from source
        run: |
          set -o pipefail
          {
            set -e
            # focal ships no DTK. Build the exact 5.2.x sources Debian
            # bullseye packaged: they are contemporary with this app and
            # support Qt 5.12, so the result matches Kylin V10 SP1's Qt.
            # Tarball hashes are pinned - curl bypasses apt signature checks.
            mkdir -p /tmp/dtk && cd /tmp/dtk
            curl -fsSLO https://deb.debian.org/debian/pool/main/d/dtkcore/dtkcore_5.2.2.5.orig.tar.gz
            curl -fsSLO https://deb.debian.org/debian/pool/main/d/dtkgui/dtkgui_5.2.2.4.orig.tar.gz
            curl -fsSLO https://deb.debian.org/debian/pool/main/d/dtkwidget/dtkwidget_5.2.2.10.orig.tar.gz
            {
              echo '8a9ecfd629dc6f8e98649a950fba24a590da867b988e621e03ff83fe634d4eef  dtkcore_5.2.2.5.orig.tar.gz'
              echo '31081c90430eda993b6bbcf061eee82fa392fc46fa5332e0c0d93194c56c27f1  dtkgui_5.2.2.4.orig.tar.gz'
              echo '35abb13c053a5005e29413f197fa3ce8a9b499be8a54798d652a22b1b7186a28  dtkwidget_5.2.2.10.orig.tar.gz'
            } | sha256sum -c -
            for t in dtkcore_5.2.2.5 dtkgui_5.2.2.4 dtkwidget_5.2.2.10; do
              tar -xzf "${t}.orig.tar.gz"
            done
            for d in dtkcore-5.2.2.5 dtkgui-5.2.2.4 dtkwidget-5.2.2.10; do
              echo "=== building $d"
              cd "/tmp/dtk/$d"
              qmake PREFIX=/usr
              make -j"$(nproc)"
              make install
              ldconfig
            done
            # Package the self-built DTK runtimes as real debs and install
            # them: dpkg then owns the files, so the offline closure's
            # ldd -> dpkg -S mapping finds them and target machines get
            # properly registered, cleanly uninstallable packages.
            build_dtk_deb() {
              name="$1"; soname="$2"; ver="$3"; sub="$4"; deps="$5"
              pkgdir="/tmp/dtk-debs/${name}"
              rm -rf "$pkgdir"
              install -d "${pkgdir}/DEBIAN" "${pkgdir}/usr/lib/${{ matrix.multiarch }}"
              # dtk 5.2's qmake installs the libraries into /usr/lib directly
              # (no multiarch subdirectory)
              cp -a /usr/lib/${soname}* "${pkgdir}/usr/lib/${{ matrix.multiarch }}/"
              for tdir in /usr/share/libdtk-*/${sub}/translations; do
                if [ -d "$tdir" ]; then
                  install -d "${pkgdir}/usr/share/libdtk-5.2.2/${sub}"
                  cp -a "$tdir" "${pkgdir}/usr/share/libdtk-5.2.2/${sub}/"
                fi
              done
              cat > "${pkgdir}/DEBIAN/control" <<EOF
          Package: ${name}
          Version: ${ver}
          Architecture: ${{ matrix.arch }}
          Maintainer: deepin-screenshot UOS customization
          Section: libs
          Priority: optional
          Depends: ${deps}
          Description: DTK ${sub} runtime, self-built for Kylin V10 SP1 offline installs
          EOF
              dpkg-deb --build --root-owner-group "${pkgdir}" "/tmp/dtk-debs/${name}_${ver}_${{ matrix.arch }}.deb"
              dpkg -i "/tmp/dtk-debs/${name}_${ver}_${{ matrix.arch }}.deb"
            }
            build_dtk_deb libdtkcore5 libdtkcore.so.5 5.2.2.5 DCore "libc6 (>= 2.31), libgcc-s1, libstdc++6 (>= 9), libglib2.0-0, libqt5core5a"
            build_dtk_deb libdtkgui5 libdtkgui.so.5 5.2.2.4 DGui "libc6 (>= 2.31), libdtkcore5, libqt5core5a, libqt5gui5"
            build_dtk_deb libdtkwidget5 libdtkwidget.so.5 5.2.2.10 DWidget "libc6 (>= 2.31), libdtkcore5, libdtkgui5, libqt5core5a, libqt5gui5, libqt5widgets5"
            ldconfig
            # dtkwm (DScreenWindowsUtil, multi-screen window selection) is a
            # separate tiny library; build it directly with g++ and moc.
            git clone --depth 1 --branch 2.0.12 https://github.com/martyr-deepin/dtkwm.git /tmp/dtkwm
            cd /tmp/dtkwm/src
            PKGS="Qt5Core Qt5Gui Qt5Widgets Qt5X11Extras Qt5DBus dtkcore xcb xcb-util"
            inc="$(pkg-config --cflags $PKGS)"
            libs="$(pkg-config --libs $PKGS)"
            moc $inc dscreenwindowsutil.h -o moc_dscreenwindowsutil.cpp
            moc $inc dwindowmanager.h -o moc_dwindowmanager.cpp
            g++ -std=c++14 -fPIC -O2 -DLIBDTKWM_LIBRARY $inc \
              -shared -Wl,-soname,libdtkwm.so.2 -o libdtkwm.so.2.0.12 \
              dscreenwindowsutil.cpp dwindowmanager.cpp \
              moc_dscreenwindowsutil.cpp moc_dwindowmanager.cpp $libs -lX11 -lXext
            install -d /usr/include/libdtkwm /usr/lib/${{ matrix.multiarch }}
            install -m644 dscreenwindowsutil.h dwindowmanager.h dtkwm_global.h /usr/include/libdtkwm/
            install -m755 libdtkwm.so.2.0.12 /usr/lib/${{ matrix.multiarch }}/
            ln -sf libdtkwm.so.2.0.12 /usr/lib/${{ matrix.multiarch }}/libdtkwm.so
            ln -sf libdtkwm.so.2.0.12 /usr/lib/${{ matrix.multiarch }}/libdtkwm.so.2
            ldconfig
          } 2>&1 | tee dtkbuild.log

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure version name
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            # safe.directory: after actions/checkout the repo dir is owned by a
            # different uid in the container, which makes plain git calls fail
            VERSION="$(git -c safe.directory='*' describe --tags --always 2>/dev/null | sed 's/^v//' || true)"
          fi
          # a Debian version must start with a digit; a bare git describe SHA
          # (no tags in the repo) would be rejected by dpkg-deb
          case "$VERSION" in
            ''|[^0-9]*) VERSION="0.0.0-${VERSION:-manual}" ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION} for ${{ matrix.arch }}"

      - name: Build
        run: |
          set -o pipefail
          {
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            make -C build -j"$(nproc)"
          } 2>&1 | tee build.log

      - name: Stage install tree
        run: |
          make -C build install DESTDIR="$PWD/staging" 2>&1 | tee stage.log

      - name: Build deb package
        run: |
          set -o pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PKGDIR="pkg/deepin-screenshot_${VERSION}_${ARCH}"
          DEBOUT="pkg/deepin-screenshot-${VERSION}-${{ matrix.osarch }}.deb"
          {
            mkdir -p "${PKGDIR}/DEBIAN"
            cp -a staging/. "${PKGDIR}/"
            # bundle the self-built dtkwm beside the binary (resolved via rpath)
            mkdir -p "${PKGDIR}/usr/lib/${{ matrix.multiarch }}/deepin-screenshot"
            cp -a /usr/lib/${{ matrix.multiarch }}/libdtkwm.so* \
              "${PKGDIR}/usr/lib/${{ matrix.multiarch }}/deepin-screenshot/"
            cat > "${PKGDIR}/DEBIAN/control" <<EOF
          Package: deepin-screenshot
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: deepin-screenshot UOS customization
          Section: utils
          Priority: optional
          Depends: libc6 (>= 2.31), libgcc-s1, libstdc++6 (>= 9)
          Description: Advanced screenshot tool (UOS ${ARCH} build)
           Easy-to-use screenshot tool with region selection and annotations:
           rectangle, ellipse, arrow, pencil, text and color tools.
           Provides the com.deepin.Screenshot DBus service.
           Built without strict Depends; install with "dpkg -i".
          EOF
            dpkg-deb --build --root-owner-group "${PKGDIR}" "${DEBOUT}"
          } 2>&1 | tee package.log

      - name: Build offline deb package
        run: |
          set -o pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          TRIPLE="${{ matrix.multiarch }}"
          PKGDIR="pkg/deepin-screenshot_${VERSION}_${ARCH}-offline"
          DEBOUT="pkg/deepin-screenshot-${VERSION}-${{ matrix.osarch }}-offline.deb"
          {
            mkdir -p "${PKGDIR}/DEBIAN"
            cp -a staging/. "${PKGDIR}/"
            mkdir -p "${PKGDIR}/usr/lib/${TRIPLE}/deepin-screenshot"
            cp -a /usr/lib/${TRIPLE}/libdtkwm.so* \
              "${PKGDIR}/usr/lib/${TRIPLE}/deepin-screenshot/"

            # Bundle the runtime dependency closure so the app can be
            # installed and run on machines without network access.
            # install-deps.sh installs only what is missing; libraries that
            # already exist on the system are used as-is.
            mkdir -p "${PKGDIR}/usr/share/deepin-screenshot/deps" /tmp/offline-cache
            LIBS="$(ldd staging/usr/bin/deepin-screenshot | awk '{print $1}' | sort -u)"
            echo "linked libs: $LIBS"
            TOP=""
            for lib in $LIBS; do
              # dpkg -S exits 1 for loader-internal libs (linux-vdso etc.);
              # || true keeps set -e from exiting silently on the assignment.
              # A library often belongs to both the runtime package and its
              # -dev counterpart; prefer the runtime one.
              p="$(dpkg -S "$lib" 2>/dev/null | cut -d: -f1 | grep -vE -- '-dev$|-dbg$|-dev-bin$' | head -1 || true)"
              [ -n "$p" ] && TOP="$TOP $p"
            done
            echo "offline deps direct closure:$TOP"
            # Expand to the full recursive Depends closure: target distros
            # (e.g. Kylin V10 SP1, Ubuntu 20.04 base) package some libraries under
            # different names, so the bundle must contain every indirect
            # dependency for dpkg -i to succeed offline.
            # the self-built DTK runtime debs are not in any apt index; seed
            # the cache so their Depends join the expansion and the copy
            # below bundles them
            mkdir -p /tmp/offline-cache
            cp /tmp/dtk-debs/*.deb /tmp/offline-cache/
            PKGS="$TOP"
            STABLE=""
            for attempt in 1 2 3; do
              for round in 1 2 3 4 5 6 7 8; do
                # the cache persists across rounds and attempts so apt only
                # fetches what is still missing; timeout turns a stalled
                # connection into a retryable error
                mkdir -p /tmp/offline-cache
                if timeout 1200 apt-get install --reinstall --download-only --no-install-recommends \
                  -y -o Acquire::Retries=5 -o Dir::Cache::archives="/tmp/offline-cache" $PKGS >/dev/null; then
                  MORE=""
                  for f in /tmp/offline-cache/*.deb; do
                    deps="$(dpkg-deb -f "$f" Depends 2>/dev/null | sed 's/ ([^)]*)//g' | tr ',' '\n' | sed 's/|.*//; s/^ *//; s/ *$//' | grep -v '^$' || true)"
                    MORE="$MORE $deps"
                  done
                  NEW="$(echo $PKGS $MORE | tr ' ' '\n' | sort -u | tr '\n' ' ')"
                  CUR="$(echo $PKGS | tr ' ' '\n' | sort -u | tr '\n' ' ')"
                  if [ "$NEW" = "$CUR" ]; then
                    STABLE=yes
                    echo "closure stable after round $round ($(echo $NEW | wc -w) packages)"
                    break
                  fi
                  PKGS="$NEW"
                  echo "closure round $round grew to $(echo $NEW | wc -w) packages"
                else
                  echo "closure download failed (attempt $attempt, round $round), retrying in 30s"
                  break
                fi
              done
              [ -n "$STABLE" ] && break
              sleep 30
            done
            # never build an offline deb from an incomplete closure
            [ -n "$STABLE" ] || { echo "dependency closure did not converge"; exit 1; }
            for f in /tmp/offline-cache/*.deb; do
              p="$(dpkg-deb -f "$f" Package)"
              [ "$(dpkg-deb -f "$f" Essential)" = "yes" ] && continue
              # glibc and anything that owns core OS machinery must never be
              # replaced by a bundled copy - upgrading systemd on the target
              # crashed Kylin V10 SP1 (see README)
              case "$p" in
                libc6|systemd*|libsystemd*|libudev*|udev|dbus*|libpam*|login|passwd) continue ;;
                # dev/toolchain packages never belong in a runtime closure;
                # upgrading them on the target would also trip the zero-upgrade
                # assertion in the verify job
                *-dev|*-dev-bin|*-dbg|gcc-*|g++-*|cpp-*|binutils*|dpkg-dev) continue ;;
              esac
              cp "$f" "${PKGDIR}/usr/share/deepin-screenshot/deps/"
            done
            cat > "${PKGDIR}/usr/share/deepin-screenshot/install-deps.sh" <<'SH'
          #!/bin/sh
          # Install the runtime dependencies bundled in ./deps that are MISSING on
          # this system. Packages already installed are always kept at their system
          # version - this installer never upgrades anything, so it cannot alter
          # the running OS. Run as root after dpkg -i:
          #   sudo /usr/share/deepin-screenshot/install-deps.sh
          set -e
          BIN=/usr/bin/deepin-screenshot
          DIR="$(cd "$(dirname "$0")" && pwd)/deps"
          cd "$DIR"
          MISSING=""
          for f in *.deb; do
            pkg="$(dpkg-deb -f "$f" Package)"
            stat="$(dpkg-query -W -f='${db:Status-Abbrev}' "$pkg" 2>/dev/null || true)"
            case "$stat" in
              ii*)
                echo "$pkg: already installed, using the system copy"
                ;;
              *)
                echo "$pkg: missing, will install $f"
                MISSING="$MISSING $f"
                ;;
            esac
          done
          if [ -n "$MISSING" ]; then
            # single dpkg call so packages configure in dependency order
            dpkg -i $MISSING
          else
            echo "nothing to install"
          fi
          echo ""
          STILL="$(ldd "$BIN" 2>/dev/null | awk '/not found/ {print $1}')"
          if [ -n "$STILL" ]; then
            echo "WARNING: these libraries are still missing, the app will not start:"
            echo "$STILL"
            exit 1
          fi
          echo "OK: all runtime libraries resolved. deepin-screenshot is ready."
          SH
            chmod 755 "${PKGDIR}/usr/share/deepin-screenshot/install-deps.sh"
            cat > "${PKGDIR}/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          # dpkg holds its lock while this script runs, so the bundled dependency
          # debs cannot be installed here directly. Detect missing libraries and
          # schedule the installer to run via systemd once the lock is released.
          if [ ! -x /usr/bin/deepin-screenshot ]; then
            echo "ERROR: /usr/bin/deepin-screenshot is missing - the package payload is broken" >&2
            exit 1
          fi
          MISSING="$(ldd /usr/bin/deepin-screenshot 2>/dev/null | awk '/not found/ {print $1}')"
          if [ -z "$MISSING" ]; then
            echo "deepin-screenshot: all runtime libraries present, nothing to do."
            exit 0
          fi
          echo "deepin-screenshot: missing runtime libraries:"
          echo "$MISSING" | sed 's/^/  /'
          if command -v systemd-run >/dev/null 2>&1; then
            echo "deepin-screenshot: auto-installing them from the bundled offline deps in 10s"
            echo "  (same as running: sudo /usr/share/deepin-screenshot/install-deps.sh)"
            systemd-run --on-active=10 --quiet --unit=deepin-screenshot-deps \
              /usr/share/deepin-screenshot/install-deps.sh 2>/dev/null \
              || echo "deepin-screenshot: auto-install could not be scheduled; run the command above manually."
          else
            echo "deepin-screenshot: run this once to install them from the bundled offline deps:"
            echo "  sudo /usr/share/deepin-screenshot/install-deps.sh"
          fi
          EOF
            chmod 755 "${PKGDIR}/DEBIAN/postinst"
            cat > "${PKGDIR}/DEBIAN/control" <<EOF
          Package: deepin-screenshot
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: deepin-screenshot UOS customization
          Section: utils
          Priority: optional
          Description: Advanced screenshot tool (UOS ${ARCH} offline build)
           Same app as the regular deb, plus a bundled runtime dependency
           closure (deps/) and install-deps.sh for machines without network
           access. Libraries already present on the system are used; only
           missing ones are installed from the bundle. Never replace glibc.
           Requires glibc >= 2.31 and Qt 5.12 era libraries (Kylin V10 SP1 /
           Ubuntu 20.04 native; installs missing packages only, never
           upgrades the system).
          EOF
            dpkg-deb --build --root-owner-group "${PKGDIR}" "${DEBOUT}"
          } 2>&1 | tee -a package.log

      - name: Build binary tarball
        run: |
          set -o pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          tar -C staging -czf "deepin-screenshot-${VERSION}-${{ matrix.osarch }}.tar.gz" . 2>&1 | tee -a package.log

      - name: Assert deb payloads
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          check() {
            deb="$1"; shift
            dpkg-deb -c "$deb" > /tmp/payload.txt
            for f in "$@"; do
              grep -qE "/${f}\$" /tmp/payload.txt || { echo "MISSING in ${deb}: ${f}"; exit 1; }
            done
            echo "payload ok: ${deb}"
          }
          check "pkg/deepin-screenshot-${VERSION}-${{ matrix.osarch }}.deb" \
            usr/bin/deepin-screenshot \
            usr/share/applications/deepin-screenshot.desktop \
            usr/share/icons/hicolor/scalable/apps/deepin-screenshot.svg \
            usr/share/dbus-1/services/com.deepin.Screenshot.service
          check "pkg/deepin-screenshot-${VERSION}-${{ matrix.osarch }}-offline.deb" \
            usr/bin/deepin-screenshot \
            usr/share/applications/deepin-screenshot.desktop \
            usr/share/icons/hicolor/scalable/apps/deepin-screenshot.svg \
            usr/share/dbus-1/services/com.deepin.Screenshot.service \
            usr/share/deepin-screenshot/install-deps.sh
          N="$(dpkg-deb -c "pkg/deepin-screenshot-${VERSION}-${{ matrix.osarch }}-offline.deb" | grep -cE 'deps/.*\.deb$')"
          echo "bundled dependency debs: ${N}"
          [ "${N}" -ge 1 ]

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepin-screenshot-${{ matrix.osarch }}-${{ steps.ver.outputs.version }}
          path: |
            pkg/*.deb
            *.tar.gz
          if-no-files-found: error

      - name: Save logs to ci-logs branch on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const ws = process.env.GITHUB_WORKSPACE || '.';
            const arch = process.env.RUNNER_ARCH === 'ARM64' ? 'aarch64' : 'amd64';
            const stamp = new Date().toISOString().replace(/[^0-9]/g, '').slice(0, 14);
            const files = [];
            for (const n of ['build.log', 'dtkbuild.log', 'stage.log', 'package.log']) {
              const p = path.join(ws, n);
              if (fs.existsSync(p)) files.push({ name: n.replace(/\.log$/, '') + '-' + arch + '-' + stamp + '.log', p });
            }
            if (files.length === 0) { core.info('no log files found'); return; }
            const { owner, repo } = context.repo;
            let baseCommit = null;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/ci-logs' });
              baseCommit = ref.data.object.sha;
            } catch (e) { /* branch does not exist yet */ }
            const tree = [];
            for (const f of files) {
              const blob = await github.rest.git.createBlob({
                owner, repo,
                content: fs.readFileSync(f.p).toString('base64'),
                encoding: 'base64',
              });
              tree.push({ path: f.name, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            let baseTree;
            if (baseCommit) {
              const c = await github.rest.git.getCommit({ owner, repo, commit_sha: baseCommit });
              baseTree = c.data.tree.sha;
            }
            const newTree = await github.rest.git.createTree({
              owner, repo,
              ...(baseTree ? { base_tree: baseTree } : {}),
              tree,
            });
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: 'ci log: ' + arch + ' failure at ' + context.sha,
              tree: newTree.data.sha,
              parents: baseCommit ? [baseCommit] : [],
            });
            if (baseCommit) {
              await github.rest.git.updateRef({ owner, repo, ref: 'heads/ci-logs', sha: commit.data.sha, force: true });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/ci-logs', sha: commit.data.sha });
            }
            core.info('logs pushed to ci-logs: ' + files.map(f => f.name).join(', '));

  verify-offline:
    name: Verify ${{ matrix.osarch }} offline install
    needs: build-deb
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            osarch: linux-aarch64
          - arch: amd64
            runner: ubuntu-24.04
            osarch: linux-amd64
    # Verify inside the target distro base itself, with no network: pure dpkg,
    # exactly like an offline Kylin machine.
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deepin-screenshot-${{ matrix.osarch }}-*
          merge-multiple: true
          # the artifact keeps its pkg/ prefix, so restore it at the workspace root
          path: .

      - name: Install offline deb and verify
        run: |
          set -o pipefail
          {
            set -e
            export DEBIAN_FRONTEND=noninteractive
            DEB="$(ls pkg/deepin-screenshot-*-offline.deb)"
            echo "verifying: ${DEB}"

            snap() {
              dpkg-query -W -f='${binary:Package}\t${Version}\t${db:Status-Abbrev}\n' 2>/dev/null \
                | awk -F'\t' '$3 ~ /^ii/ {print $1 "\t" $2}' | sort
            }
            snap > /tmp/before.tsv

            dpkg -i "${DEB}"
            # the container has no systemd for the deferred installer, so run
            # it directly, exactly as postinst instructs on a real machine
            /usr/share/deepin-screenshot/install-deps.sh
            snap > /tmp/after.tsv

            # zero-upgrade assertion: no pre-existing (name, version) pair may
            # disappear - an upgrade or replacement would show up here
            CHANGED="$(comm -23 /tmp/before.tsv /tmp/after.tsv)"
            if [ -n "${CHANGED}" ]; then
              echo "FAIL: installed packages were changed or removed:"
              echo "${CHANGED}"
              exit 1
            fi

            # the bundle must have added the DTK runtime that focal lacks
            for p in libdtkcore5 libdtkgui5 libdtkwidget5; do
              awk -F'\t' -v pkg="${p}" '$1==pkg{f=1} END{exit f?0:1}' /tmp/after.tsv \
                || { echo "FAIL: ${p} not installed from the bundle"; exit 1; }
            done
            echo "newly installed packages: $(comm -13 /tmp/before.tsv /tmp/after.tsv | wc -l)"

            # ldd gate: nothing may be unresolved
            NOTFOUND="$(ldd /usr/bin/deepin-screenshot 2>&1 | awk '/not found/ {print $1}')"
            if [ -n "${NOTFOUND}" ]; then
              echo "FAIL: ldd reports unresolved libraries:"
              echo "${NOTFOUND}"
              exit 1
            fi
            echo "verification passed: offline install is purely additive and all libraries resolve"
          } 2>&1 | tee verify.log

      - name: Save verify log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const ws = process.env.GITHUB_WORKSPACE || '.';
            const arch = process.env.RUNNER_ARCH === 'ARM64' ? 'aarch64' : 'amd64';
            const stamp = new Date().toISOString().replace(/[^0-9]/g, '').slice(0, 14);
            const files = [];
            for (const n of ['verify.log']) {
              const p = path.join(ws, n);
              if (fs.existsSync(p)) files.push({ name: n.replace(/\.log$/, '') + '-' + arch + '-' + stamp + '.log', p });
            }
            if (files.length === 0) { core.info('no log files found'); return; }
            const { owner, repo } = context.repo;
            let baseCommit = null;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/ci-logs' });
              baseCommit = ref.data.object.sha;
            } catch (e) { /* branch does not exist yet */ }
            const tree = [];
            for (const f of files) {
              const blob = await github.rest.git.createBlob({
                owner, repo,
                content: fs.readFileSync(f.p).toString('base64'),
                encoding: 'base64',
              });
              tree.push({ path: f.name, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            let baseTree;
            if (baseCommit) {
              const c = await github.rest.git.getCommit({ owner, repo, commit_sha: baseCommit });
              baseTree = c.data.tree.sha;
            }
            const newTree = await github.rest.git.createTree({
              owner, repo,
              ...(baseTree ? { base_tree: baseTree } : {}),
              tree,
            });
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: 'ci log: verify failure (' + arch + ') at ' + context.sha,
              tree: newTree.data.sha,
              parents: baseCommit ? [baseCommit] : [],
            });
            if (baseCommit) {
              await github.rest.git.updateRef({ owner, repo, ref: 'heads/ci-logs', sha: commit.data.sha, force: true });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/ci-logs', sha: commit.data.sha });
            }
            core.info('verify log pushed to ci-logs');

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-deb, verify-offline]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat > release_notes.md <<'EOF'
          deepin-screenshot custom build (UOS/deepin), based on upstream 4.2.x.

          - Classic deepin screenshot tool: fullscreen / active-window / delayed
            capture, region selection with rectangle, ellipse, arrow, pencil,
            text and color annotation tools
          - Provides the com.deepin.Screenshot DBus service

          Built on Ubuntu 20.04 for Kylin V10 SP1 desktop (same distro base:
          Qt 5.12.8 / glibc 2.31, matching library names). The offline
          installer only adds packages missing on the target and never
          upgrades an installed one, so it cannot touch systemd or any other
          OS component. NOT supported: Kylin V10 original (glibc 2.23), UOS 20
          (glibc 2.28) - those need an on-device build.
          Assets: arm64 for UOS ARM64 devices, amd64 for x86_64 (VM) testing.
          Install: `sudo dpkg -i deepin-screenshot-*.deb` (no strict Depends, a
          UOS/deepin desktop provides the Qt5/DTK runtime).

          Offline machines: grab the -offline deb instead. It bundles the
          runtime dependency closure; after dpkg -i, run
          `sudo /usr/share/deepin-screenshot/install-deps.sh` once — it
          installs only the libraries missing on that system, already
          installed ones are used as-is.
          EOF
          NOTES_JSON=$(sed 's/\\/\\\\/g; s/"/\\"/g' release_notes.md | awk 'BEGIN{ORS=""} {print $0 "\\n"}')

          API="https://api.github.com/repos/${REPO}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"

          RELEASE_ID=$(curl -sf -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "$API/releases" \
            -d "{\"tag_name\":\"${TAG_NAME}\",\"name\":\"deepin-screenshot ${TAG_NAME#v} (UOS)\",\"target_commitish\":\"master\",\"body\":\"${NOTES_JSON}\"}" \
            | grep -o '"id": *[0-9]*' | head -1 | grep -oE '[0-9]+')

          if [ -z "$RELEASE_ID" ]; then
            # release for this tag already exists: reuse it
            RELEASE_ID=$(curl -sf -H "$AUTH" -H "Accept: application/vnd.github+json" \
              "$API/releases/tags/${TAG_NAME}" | grep -o '"id": *[0-9]*' | head -1 | grep -oE '[0-9]+')
          fi
          test -n "$RELEASE_ID"

          for ASSET in $(find assets -type f); do
            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
              --data-binary @"$ASSET" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=$(basename "$ASSET")" > /dev/null \
              || echo "failed to upload $(basename "$ASSET")"
            echo "uploaded asset: $(basename "$ASSET")"
          done
