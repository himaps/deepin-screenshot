name: release

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-deb:
    name: Build ${{ matrix.arch }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            multiarch: aarch64-linux-gnu
          - arch: amd64
            runner: ubuntu-24.04
            multiarch: x86_64-linux-gnu
    # Native runners produce native builds, no cross compilation needed
    runs-on: ${{ matrix.runner }}
    # Build inside Debian bookworm (current oldstable, fully served): Qt 5.15,
    # DTK 5.5, glibc 2.36. For very old UOS 20 devices prefer an on-device build.
    container: debian:bookworm-slim
    env:
      # The bookworm-slim container's pkg-config does not search the multiarch
      # pkgconfig directory on its own
      PKG_CONFIG_PATH: /usr/lib/${{ matrix.multiarch }}/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig

    steps:
      - name: Install build dependencies
        run: |
          set -e
          for attempt in 1 2 3 4; do
            if apt-get update; then
              break
            fi
            echo "apt-get update failed (attempt $attempt), retrying in 20s" >&2
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
            sleep 20
          done
          apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            build-essential cmake pkg-config git curl ca-certificates \
            qtbase5-dev qttools5-dev-tools libdtkwidget-dev \
            libxcb-util-dev libx11-dev libxext-dev

      - name: Build dtkwm from source
        run: |
          set -e
          # dtkwm (DScreenWindowsUtil) is not packaged in Debian bookworm, but
          # deepin-screenshot needs it for multi-screen window selection. It is
          # a tiny qmake library; build it directly with g++ and moc.
          git clone --depth 1 --branch 2.0.12 https://github.com/martyr-deepin/dtkwm.git /tmp/dtkwm
          cd /tmp/dtkwm/src
          PKGS="Qt5Core Qt5Gui Qt5Widgets Qt5X11Extras Qt5DBus dtkcore xcb xcb-util"
          inc="$(pkg-config --cflags $PKGS)"
          libs="$(pkg-config --libs $PKGS)"
          moc $inc dscreenwindowsutil.h -o moc_dscreenwindowsutil.cpp
          moc $inc dwindowmanager.h -o moc_dwindowmanager.cpp
          g++ -std=c++14 -fPIC -O2 -DLIBDTKWM_LIBRARY $inc \
            -shared -Wl,-soname,libdtkwm.so.2 -o libdtkwm.so.2.0.12 \
            dscreenwindowsutil.cpp dwindowmanager.cpp \
            moc_dscreenwindowsutil.cpp moc_dwindowmanager.cpp $libs -lX11 -lXext
          install -d /usr/include/libdtkwm /usr/lib/${{ matrix.multiarch }}
          install -m644 dscreenwindowsutil.h dwindowmanager.h dtkwm_global.h /usr/include/libdtkwm/
          install -m755 libdtkwm.so.2.0.12 /usr/lib/${{ matrix.multiarch }}/
          ln -sf libdtkwm.so.2.0.12 /usr/lib/${{ matrix.multiarch }}/libdtkwm.so
          ln -sf libdtkwm.so.2.0.12 /usr/lib/${{ matrix.multiarch }}/libdtkwm.so.2
          ldconfig

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure version name
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            # safe.directory: after actions/checkout the repo dir is owned by a
            # different uid in the container, which makes plain git calls fail
            VERSION="$(git -c safe.directory='*' describe --tags --always 2>/dev/null | sed 's/^v//' || true)"
          fi
          # a Debian version must start with a digit; a bare git describe SHA
          # (no tags in the repo) would be rejected by dpkg-deb
          case "$VERSION" in
            ''|[^0-9]*) VERSION="0.0.0-${VERSION:-manual}" ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION} for ${{ matrix.arch }}"

      - name: Build
        run: |
          set -o pipefail
          {
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            make -C build -j"$(nproc)"
          } 2>&1 | tee build.log

      - name: Stage install tree
        run: |
          make -C build install DESTDIR="$PWD/staging" 2>&1 | tee stage.log

      - name: Build deb package
        run: |
          set -o pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PKGDIR="pkg/deepin-screenshot_${VERSION}_${ARCH}"
          {
            mkdir -p "${PKGDIR}/DEBIAN"
            cp -a staging/. "${PKGDIR}/"
            # bundle the self-built dtkwm beside the binary (resolved via rpath)
            mkdir -p "${PKGDIR}/usr/lib/${{ matrix.multiarch }}/deepin-screenshot"
            cp -a /usr/lib/${{ matrix.multiarch }}/libdtkwm.so* \
              "${PKGDIR}/usr/lib/${{ matrix.multiarch }}/deepin-screenshot/"
            cat > "${PKGDIR}/DEBIAN/control" <<EOF
          Package: deepin-screenshot
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: deepin-screenshot UOS customization
          Section: utils
          Priority: optional
          Description: Advanced screenshot tool (UOS ${ARCH} build)
           Easy-to-use screenshot tool with region selection and annotations:
           rectangle, ellipse, arrow, pencil, text and color tools.
           Provides the com.deepin.Screenshot DBus service.
           Built without strict Depends; install with "dpkg -i".
          EOF
            dpkg-deb --build --root-owner-group "${PKGDIR}"
          } 2>&1 | tee package.log

      - name: Build offline deb package
        run: |
          set -o pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          TRIPLE="${{ matrix.multiarch }}"
          PKGDIR="pkg/deepin-screenshot_${VERSION}_${ARCH}-offline"
          {
            mkdir -p "${PKGDIR}/DEBIAN"
            cp -a staging/. "${PKGDIR}/"
            mkdir -p "${PKGDIR}/usr/lib/${TRIPLE}/deepin-screenshot"
            cp -a /usr/lib/${TRIPLE}/libdtkwm.so* \
              "${PKGDIR}/usr/lib/${TRIPLE}/deepin-screenshot/"

            # Bundle the runtime dependency closure so the app can be
            # installed and run on machines without network access.
            # install-deps.sh installs only what is missing; libraries that
            # already exist on the system are used as-is.
            mkdir -p "${PKGDIR}/usr/share/deepin-screenshot/deps" /tmp/offline-cache
            LIBS="$(ldd staging/usr/bin/deepin-screenshot | awk '{print $1}' | sort -u)"
            TOP=""
            for lib in $LIBS; do
              p="$(dpkg -S "$lib" 2>/dev/null | head -1 | cut -d: -f1)"
              [ -n "$p" ] && TOP="$TOP $p"
            done
            echo "offline deps closure:$TOP"
            apt-get install --reinstall --download-only --no-install-recommends \
              -y -o Dir::Cache::archives="/tmp/offline-cache" $TOP
            for f in /tmp/offline-cache/*.deb; do
              p="$(dpkg-deb -f "$f" Package)"
              [ "$(dpkg-deb -f "$f" Essential)" = "yes" ] && continue
              # glibc must never be replaced by a bundled copy
              [ "$p" = "libc6" ] && continue
              cp "$f" "${PKGDIR}/usr/share/deepin-screenshot/deps/"
            done
            cat > "${PKGDIR}/usr/share/deepin-screenshot/install-deps.sh" <<'SH'
            #!/bin/sh
            # Install the runtime dependencies bundled in ./deps that are
            # missing on this system. Run once as root after dpkg -i:
            #   sudo /usr/share/deepin-screenshot/install-deps.sh
            set -e
            DIR="$(cd "$(dirname "$0")" && pwd)/deps"
            cd "$DIR"
            MISSING=""
            for f in *.deb; do
              pkg="$(dpkg-deb -f "$f" Package)"
              if dpkg-query -W -f='${db:Status-Abbrev}' "$pkg" 2>/dev/null | grep -q '^ii'; then
                echo "$pkg: already installed, using the system copy"
              else
                echo "$pkg: missing, will install $f"
                MISSING="$MISSING $f"
              fi
            done
            if [ -n "$MISSING" ]; then
              # single dpkg call so packages configure in dependency order
              dpkg -i $MISSING
            else
              echo "nothing to install"
            fi
            SH
            chmod 755 "${PKGDIR}/usr/share/deepin-screenshot/install-deps.sh"
            cat > "${PKGDIR}/DEBIAN/postinst" <<'EOF'
            #!/bin/sh
            echo "Offline machine missing runtime libraries? Run: sudo /usr/share/deepin-screenshot/install-deps.sh"
            EOF
            chmod 755 "${PKGDIR}/DEBIAN/postinst"
            cat > "${PKGDIR}/DEBIAN/control" <<EOF
            Package: deepin-screenshot
            Version: ${VERSION}
            Architecture: ${ARCH}
            Maintainer: deepin-screenshot UOS customization
            Section: utils
            Priority: optional
            Description: Advanced screenshot tool (UOS ${ARCH} offline build)
             Same app as the regular deb, plus a bundled runtime dependency
             closure (deps/) and install-deps.sh for machines without network
             access. Libraries already present on the system are used; only
             missing ones are installed from the bundle. Never replace glibc.
             Requires glibc >= 2.34 (deepin 23 / V25 / Debian 12 era).
            EOF
            dpkg-deb --build --root-owner-group "${PKGDIR}"
          } 2>&1 | tee -a package.log

      - name: Build binary tarball
        run: |
          set -o pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          tar -C staging -czf "deepin-screenshot_${VERSION}_${{ matrix.arch }}.tar.gz" . 2>&1 | tee -a package.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepin-screenshot-${{ matrix.arch }}-${{ steps.ver.outputs.version }}
          path: |
            pkg/*.deb
            *.tar.gz
          if-no-files-found: error

      - name: Save logs to ci-logs branch on failure
        if: failure()
        env:
          TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          STAMP="$(date +%Y%m%d%H%M%S)"
          git clone --no-checkout "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/logsrepo
          cd /tmp/logsrepo
          if git ls-remote --heads origin ci-logs | grep -q ci-logs; then
            git fetch --depth 1 origin ci-logs
            git checkout ci-logs
          else
            git checkout --orphan ci-logs
            git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          fi
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci-bot"
          for f in build.log stage.log package.log; do
            cp "$GITHUB_WORKSPACE/$f" "./${f%.log}-${ARCH}-${STAMP}.log" 2>/dev/null || true
          done
          git add -A
          git commit -m "ci log: ${ARCH} build failure at ${GITHUB_SHA}"
          git push origin ci-logs

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat > release_notes.md <<'EOF'
          deepin-screenshot custom build (UOS/deepin), based on upstream 4.2.x.

          - Classic deepin screenshot tool: fullscreen / active-window / delayed
            capture, region selection with rectangle, ellipse, arrow, pencil,
            text and color annotation tools
          - Provides the com.deepin.Screenshot DBus service

          Built against Qt 5.15 and DTK 5.5 (Debian bookworm) on native runners.
          Requires glibc >= 2.34 (deepin 23 / V25 / Debian 12 era); for very
          old UOS 20 devices prefer an on-device build.
          Assets: arm64 for UOS ARM64 devices, amd64 for x86_64 (VM) testing.
          Install: `sudo dpkg -i deepin-screenshot_*.deb` (no strict Depends, a
          UOS/deepin desktop provides the Qt5/DTK runtime).

          Offline machines: grab the -offline deb instead. It bundles the
          runtime dependency closure; after dpkg -i, run
          `sudo /usr/share/deepin-screenshot/install-deps.sh` once — it
          installs only the libraries missing on that system, already
          installed ones are used as-is.
          EOF
          NOTES_JSON=$(sed 's/\\/\\\\/g; s/"/\\"/g' release_notes.md | awk 'BEGIN{ORS=""} {print $0 "\\n"}')

          API="https://api.github.com/repos/${REPO}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"

          RELEASE_ID=$(curl -sf -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "$API/releases" \
            -d "{\"tag_name\":\"${TAG_NAME}\",\"name\":\"deepin-screenshot ${TAG_NAME#v} (UOS)\",\"target_commitish\":\"master\",\"body\":\"${NOTES_JSON}\"}" \
            | grep -o '"id": *[0-9]*' | head -1 | grep -oE '[0-9]+')

          if [ -z "$RELEASE_ID" ]; then
            # release for this tag already exists: reuse it
            RELEASE_ID=$(curl -sf -H "$AUTH" -H "Accept: application/vnd.github+json" \
              "$API/releases/tags/${TAG_NAME}" | grep -o '"id": *[0-9]*' | head -1 | grep -oE '[0-9]+')
          fi
          test -n "$RELEASE_ID"

          for ASSET in $(find assets -type f); do
            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
              --data-binary @"$ASSET" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=$(basename "$ASSET")" > /dev/null \
              || echo "failed to upload $(basename "$ASSET")"
            echo "uploaded asset: $(basename "$ASSET")"
          done
